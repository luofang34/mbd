[workspace]
resolver = "3"
members = [
    "crates/mbd-airdata",
    "crates/mbd-core",
    "crates/mbd-provenance",
    "crates/syspack",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false
license = "AGPL-3.0-or-later"
repository = "https://github.com/luofang34/mbd"

[workspace.dependencies]
mbd-airdata = { path = "crates/mbd-airdata" }
mbd-core = { path = "crates/mbd-core" }
mbd-provenance = { path = "crates/mbd-provenance" }
syspack = { path = "crates/syspack" }

glam = { version = "0.33", default-features = false, features = ["f64", "libm"] }
libm = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.11"
tempfile = "3"
thiserror = { version = "2", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[workspace.lints.clippy]
unwrap_used = "forbid"
expect_used = "forbid"
panic = "forbid"
todo = "forbid"
unimplemented = "forbid"
unreachable = "forbid"
exit = "forbid"
mem_forget = "forbid"
get_unwrap = "forbid"
indexing_slicing = "deny"
let_underscore_must_use = "deny"
let_underscore_future = "deny"
await_holding_lock = "deny"
disallowed_types = "deny"
disallowed_macros = "deny"
