[structure]
enabled = true
max_rs_lines = 500
max_lib_rs_lines = 100
max_fn_lines = 80
require_lib_rs_doc = true
forbid_mod_rs = true
forbid_generic_filenames = ["utils.rs", "helpers.rs", "common.rs"]
forbid_stray_artifacts = true
