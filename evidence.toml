# Static architecture and structure gates for the mbd workspace.
# Run: cargo evidence gate --format=jsonl
schema_version = 1

[workspace]
name = "mbd"
exclude_paths = ["target/**"]

[architecture]
in_scope = [
    "mbd-core",
    "mbd-airdata",
    "mbd-provenance",
    "mbd-multibody",
    "mbd-systems",
    "mbd-aero",
    "syspack",
    "mbd-design",
]
no_out_of_scope_deps = true
require_all_crates_layered = true

[[architecture.layers]]
name = "contracts"
crates = ["mbd-core", "mbd-airdata", "mbd-provenance"]
allow_same_layer = false

[[architecture.layers]]
name = "mechanisms"
crates = ["mbd-multibody", "mbd-systems"]
allow_same_layer = false

[[architecture.layers]]
name = "aerodynamics"
crates = ["mbd-aero"]
allow_same_layer = false

[[architecture.layers]]
name = "syspack"
crates = ["syspack"]
allow_same_layer = false

[[architecture.layers]]
name = "design"
crates = ["mbd-design"]
allow_same_layer = false

